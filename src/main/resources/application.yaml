spring:
  application:
    name: AskMyDb

  datasource:
    url: jdbc:postgresql://localhost:5434/askmydb
    username: askmydb
    password: askmydb
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2
        options:
          temperature: 0.1
      embedding:
        model: nomic-embed-text

    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
        schema-name: public
        table-name: schema_embeddings

askmydb:
  jwt:
    # Base64-encoded random secret used to sign/verify tokens (HMAC-SHA256).
    # Fine to keep here for a portfolio project; in a real production app
    # this would come from an environment variable, never committed to git.
    secret: qHb1PVahGxtjz5F/wVWTzua6QNAPYm6mgSqRI6gI724=
    # Access token lifetime in milliseconds - 1 hour. Deliberately short:
    # if one leaks, the exposure window is small. Long-lived sessions are
    # handled by the refresh token below instead of a long access token.
    expiration-ms: 3600000
    # Refresh token lifetime in milliseconds - 7 days. Unlike the access
    # token, this one is tracked in the refresh_tokens table, so it CAN be
    # revoked (on logout, or if it's ever reused after being rotated).
    refresh-expiration-ms: 604800000

  rag:
    # How many of the most-relevant tables to retrieve per question.
    # Deliberately less than the total table count (4) so retrieval is
    # actually filtering something, not just returning everything.
    top-k: 3
