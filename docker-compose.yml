version: "3.9"
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: askmydb-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: askmydb
      POSTGRES_USER: askmydb
      POSTGRES_PASSWORD: askmydb
    ports:
      - "5434:5432"
    volumes:
      - askmydb_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askmydb -d askmydb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  askmydb_pgdata:
